# Render deployment configuration for Phytofix Backend
# Documentation: https://render.com/docs/yaml-spec

services:
  - type: web
    name: phytofix-backend
    env: docker
    region: oregon
    plan: starter
    domain: api.phytofix.ng
    startCommand: |
      php-fpm -D && exec nginx -g 'daemon off;'
    envVars:
      # Application settings
      - key: APP_NAME
        value: Phytofix
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: https://api.phytofix.ng
      - key: APP_LOCALE
        value: en
      - key: APP_FALLBACK_LOCALE
        value: en
      - key: APP_FAKER_LOCALE
        value: en_US
      - key: APP_MAINTENANCE_DRIVER
        value: file

      # Security - Set in Render dashboard
      - key: APP_KEY
        sync: false
      - key: BCRYPT_ROUNDS
        value: "12"

      # Logging
      - key: LOG_CHANNEL
        value: stack
      - key: LOG_STACK
        value: single
      - key: LOG_DEPRECATIONS_CHANNEL
        value: null
      - key: LOG_LEVEL
        value: warning

      # Database (MySQL) - Set password in Render dashboard
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        value: your-db-host.com
      - key: DB_PORT
        value: "3306"
      - key: DB_DATABASE
        value: phytofix
      - key: DB_USERNAME
        value: phytofix_user
      - key: DB_PASSWORD
        sync: false

      # Session & Cache
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_LIFETIME
        value: "120"
      - key: SESSION_ENCRYPT
        value: "false"
      - key: SESSION_PATH
        value: "/"
      - key: SESSION_DOMAIN
        value: null

      # Broadcasting
      - key: BROADCAST_CONNECTION
        value: log

      # Filesystem
      - key: FILESYSTEM_DISK
        value: local

      # Queue
      - key: QUEUE_CONNECTION
        value: database

      # Cache
      - key: CACHE_STORE
        value: database

      # Mail
      - key: MAIL_MAILER
        value: log
      - key: MAIL_SCHEME
        value: null
      - key: MAIL_HOST
        value: localhost
      - key: MAIL_PORT
        value: "2525"
      - key: MAIL_USERNAME
        value: null
      - key: MAIL_PASSWORD
        value: null
      - key: MAIL_FROM_ADDRESS
        value: "hello@example.com"
      - key: MAIL_FROM_NAME
        value: "${APP_NAME}"

      # Admin & Contact
      - key: ADMIN_EMAIL
        value: admin@phytofix.ng
      - key: CONTACT_INBOX_EMAIL
        value: info.phytofix@gmail.com

      # Seed key - Set in Render dashboard
      - key: SEED_KEY
        sync: false

      # Frontend
      - key: VITE_APP_NAME
        value: "${APP_NAME}"

    healthCheckPath: /
    healthCheckTimeout: 300